<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home | Django</title>
    <style>
        body { margin: 0; min-height: 100vh; display: grid; place-items: center;
            font-family: Arial, sans-serif; background: #f3f4f6; color: #111827; padding: 20px; }
        .card { background: white; padding: 36px; border-radius: 16px; text-align: center;
            box-shadow: 0 12px 35px rgba(0,0,0,.08); max-width: 500px; }
        a { display: inline-block; margin-top: 16px; background: #4f46e5; color: white;
            text-decoration: none; padding: 11px 20px; border-radius: 8px; }
    </style>
</head>
<body>
    <main class="card">
        <h1>Login successful!</h1>
        <p>You are now on the protected home page.</p>
        <a href="{% url 'logout' %}">Log out</a>
    </main>
</body>
</html>
